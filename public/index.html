<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Pulse</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f7f7f7;
    }
    h1 { color: #222; }
    input {
      width: 70%;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    #report {
      margin-top: 20px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    #report p { margin: 6px 0; }
    #error {
      margin-top: 20px;
      color: #b00020;
      display: none;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>🔍 Page Pulse</h1>
  <p>Enter a URL to get an instant audit report.</p>

  <input type="text" id="urlInput" placeholder="https://example.com">
  <button id="checkBtn">Check</button>

  <div id="report"></div>
  <div id="error"></div>

  <footer>
    Built for <a href="https://digitalheroesco.com" target="_blank">Digital Heroes Training Task</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
